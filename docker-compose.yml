services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-comma}
      MARIADB_USER: ${MARIADB_USER:-comma_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./migration.sql:/docker-entrypoint-initdb.d/migration.sql
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    environment:
      CLIENT_URL: ${CLIENT_URL:-http://localhost:4000}
      DB_NAME: ${DB_NAME:-comma}
      DB_USER: ${DB_USER:-comma_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT:-3306}
      DB_URL: ${DB_URL:-db}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-comma-users}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7}
      JWT_ISSUER: ${JWT_ISSUER:-comma}
      JWT_SECRET: ${JWT_SECRET}
      PROXY_API_KEY: ${PROXY_API_KEY}
      PROXY_URL: ${PROXY_URL:-https://proxy.hkayrad.me}
      SERVER_PORT: ${SERVER_PORT:-3001}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      - db
    volumes:
      - ./server/uploads:/app/uploads
    ports:
      - "3001:3001"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
        VITE_WEBSOCKET_URL: ${VITE_WEBSOCKET_URL:-ws://localhost:3001/notification}
        VITE_ENV: ${VITE_ENV:-production}
    ports:
      - "4000:80"
    depends_on:
      - server

volumes:
  db_data:
