---
deployment:
  tasks:
    - export CLIENT_ROOT=/home/htrltd/comma.orhandogan.com.tr
    - export API_ROOT=/home/htrltd/api.orhandogan.com.tr

    # 1. Build the project in the repository
    - /bin/bash deploy.sh > deploy.log 2>&1

    # 2. Deploy Client (Static Files)
    # Copy the contents of client/dist to the client subdomain root
    - /bin/cp -r client/dist/* $CLIENT_ROOT

    # 3. Deploy API (Node.js Server)
    # Copy server files (dist, node_modules, package.json) to the api subdomain root
    - /bin/cp -r server/dist/* $API_ROOT
    - cd $API_ROOT && npm install --omit=dev
    - cd $API_ROOT && node sync-db.js

    # 4. Restart API Server (Phusion Passenger)
    - mkdir -p $API_ROOT/tmp
    - touch $API_ROOT/tmp/restart.txt
